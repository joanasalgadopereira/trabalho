<!DOCTYPE html>

<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Horários | Entre Patas
    </title>

    <link
        rel="stylesheet"
        href="trabalho.css"
    >

</head>


<body>


    <main>

        <section class="reservas">


            <!-- TOPO DA ÁREA ADMIN -->

            <div class="reservas-header">


                <div class="reservas-header-topo">


                    <p class="section-label">
                        Gestão de horários
                    </p>


                    <div class="reservas-acoes">


                        <a
                            href="trabalho.html"
                            class="btn btn-secondary"
                        >
                            ← Voltar ao site
                        </a>


                        <a
                            href="admin.html"
                            class="btn btn-secondary"
                        >
                            ← Voltar ao painel
                        </a>


                        <button
                            type="button"
                            id="terminar_sessao"
                            class="btn btn-secondary"
                        >
                            Terminar sessão
                        </button>


                    </div>


                </div>


                <h1>
                    Horários
                </h1>


                <p>
                    Cria e gere os horários disponíveis
                    para marcação.
                </p>


            </div>



            <!-- NAVEGAÇÃO ADMIN -->

            <nav class="admin-nav"
                 aria-label="Navegação da área administrativa">


                <a
                    href="reservas.html"
                    class="btn btn-secondary"
                >
                    Reservas
                </a>


                <a
                    href="horarios.html"
                    class="btn btn-primary"
                >
                    Horários
                </a>


            </nav>



            <!-- CRIAR HORÁRIO -->

            <section class="horarios-criar">


                <h2>
                    Criar horário
                </h2>


                <form id="form_horario">


                    <div class="form-grid">


                        <div class="form-group">


                            <label for="data_horario">
                                Data
                            </label>


                            <input
                                type="date"
                                id="data_horario"
                                required
                            >


                        </div>



                        <div class="form-group">


                            <label for="hora_inicio">
                                Hora de início
                            </label>


                            <input
                                type="time"
                                id="hora_inicio"
                                required
                            >


                        </div>



                        <div class="form-group">


                            <label for="hora_fim">
                                Hora de fim
                            </label>


                            <input
                                type="time"
                                id="hora_fim"
                                required
                            >


                        </div>


                    </div>



                    <div class="form-actions">


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Criar horário
                        </button>


                    </div>


                </form>


            </section>



            <!-- LISTA DE HORÁRIOS -->

            <section class="horarios-lista">


                <h2>
                    Horários existentes
                </h2>


                <div
                    id="lista_horarios"
                    aria-live="polite"
                >

                    <p>
                        A carregar horários...
                    </p>

                </div>


            </section>


        </section>

    </main>



    <script src="horarios.js"></script>


</body>

</html>
