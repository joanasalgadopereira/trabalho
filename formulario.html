<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=form, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="server.js">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o seu nome" required minlength="2" maxlength="50">
    <label for="email1">Email</label>
    <input type="email" id="email1" name="email" required placeholder="Digite o email">
    <br>
    <label for="password">Password</label>
    <input type="password"
        id="password"
        name="password"
        required
        minlength="8"
>
<br>
<label for="idade">Idade</label>
<input type="number"
        id="idade"
        name="idade"
        min="18"
        max="100"
        step="1"
        >
        <br>
<label for="data_nascimento">Data de nascimento</label>
<input type="date"
        id="data_nascimento"
        name="data_nascimento"
        min="2010-12-31"
        >
<br>
<label for="pais">País</label>
        <select name="pais" id="pais">
           <option value="" disabled selected >Selecione um pais</option>
            <option value="pt">Portugal</option>
            <option value="es">Espanha</option>
            <option value="fr">França</option>
            <option value="ds">Alemanha</option>
            <option value="outro">Outro</option>
        </select>
<br>

<label>Genero</label>
<br>
<input type="radio" id="Masculino" name="Genero" value="Masculino">
<label for="Masculino">Masculino</label>
<input type="radio" id="Feminino" name="Genero" value="Feminino">
<label for="Feminino">Feminino</label>
<input type="radio" id="nao_binario" name="Genero" value="nao_binario">
<label for="nao_binario">Nao binario</label>
<br>
<label>Interesses (selecione todos os que se aplicam)</label>
    <br>
    <input type="checkbox" id="ler" name="interesses" value="leitura">
    <label for="ler">Leitura</label>
    <input type="checkbox" id="musica" name="interesses" value="musica">
    <label for="musica">Música</label>


        <button type="submit">Enviar</button>
    </form>
</body>
</html>
